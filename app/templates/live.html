<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ data.titre }} — Tableau de bord</title>
  <style>
    /* ===================================================================
       Tableau de bord salle (téléviseur 16:9 ou 16:10, projecteur).
       Lecture seule, aucune interaction. Grandes polices, fort contraste.
       Tout est inline pour rester autonome (style.css de l'appli est
       pensé mobile-first ; cet écran a sa propre mise en page plein cadre).

       MISE EN PAGE — deux zones, deux blocs chacune :

         ┌──────────────────────────────────────────┐
         │ titre                             heure  │
         ├────────────────────┬─────────────────────┤
         │ annonce + chiffres │ derniers mouvements │  zone haute  (1 part)
         ├────────────────────┼─────────────────────┤
         │ tournois           │ animations          │  zone basse  (2 parts)
         └────────────────────┴─────────────────────┘

       Le flux des prêts occupait auparavant une colonne pleine hauteur, au
       détriment des tournois et des animations — l'information qu'un visiteur
       vient chercher. Il partage désormais la zone haute avec les chiffres.
       =================================================================== */
    :root {
      --fond: #0f172a;          /* bleu nuit */
      --carte: #1e293b;
      --carte-2: #243349;
      --texte: #f1f5f9;
      --attenue: #94a3b8;
      --accent: #38bdf8;
      --vert: #4ade80;
      --orange: #fbbf24;
      --rouge: #f87171;
      --bordure: #334155;
      --annonce-fond: #b45309;   /* ambre soutenu, distinct du reste de la palette */
      --annonce-texte: #fff7ed;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--fond);
      color: var(--texte);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      /* Taille de base bornée par la LARGEUR *et* la HAUTEUR : sur un 16:10 la
         hauteur supplémentaire profite au contenu, et une fenêtre large et
         basse (navigateur non plein écran) ne déborde plus. */
      font-size: clamp(14px, min(1.6vw, 2.9vh), 30px);
    }

    /* Colonne flexbox plutôt qu'une grille à pistes positionnelles : le
       bandeau d'annonce (masqué par défaut) ne doit jamais décaler quelle
       piste hérite de l'espace restant. */
    .ecran {
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 1.1vw;
      /* Marges généreuses : beaucoup de téléviseurs rognent 2 à 5 % des bords
         (overscan). Rien de significatif ne doit tomber hors cadre. */
      padding: 2.4vh 2.4vw;
    }

    /* --- En-tête --- */
    .entete {
      flex: 0 0 auto;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .entete h1 { font-size: 2.1em; letter-spacing: -0.5px; }
    .entete .horloge {
      font-size: 2.1em;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      font-weight: 700;
    }
    .entete .horloge .point {
      display: inline-block; width: 0.45em; height: 0.45em;
      border-radius: 50%; background: var(--vert);
      margin-right: 0.5em; vertical-align: middle;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    /* Indicateur de fraîcheur des données : après plusieurs échecs consécutifs
       de /live/data, le point cesse de "battre" en vert (ce qui donnerait
       l'illusion trompeuse d'un écran vivant alors qu'il est figé) et une
       mention discrète apparaît. */
    .entete .horloge .point.hors-ligne {
      background: var(--rouge);
      animation: none;
    }
    .entete .horloge .statut-reseau {
      display: none;
      font-size: 0.42em;
      font-weight: 700;
      color: var(--rouge);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-left: 0.6em;
      vertical-align: middle;
    }

    /* --- Les deux zones ---
       `flex: N 1 0` plutôt qu'une hauteur en pourcentage : si une zone est
       entièrement éteinte en administration, l'autre récupère TOUTE la
       hauteur sans le moindre calcul. Même principe à l'intérieur d'une zone
       pour ses deux blocs — masquer un bloc suffit, le voisin s'étend seul.
       C'est ce qui remplace l'ancienne mécanique de pistes `cols-1/2/3`. */
    .zone {
      display: flex;
      gap: 1.1vw;
      min-height: 0;
    }
    .zone-haute { flex: 1 1 0; }
    .zone-basse { flex: 2 1 0; }
    /* `min-height: 0` est INDISPENSABLE : sans lui, un bloc flex refuse de
       descendre sous la hauteur de son contenu et déborde par le bas, en
       recouvrant la zone suivante au lieu d'être rogné (bug constaté en salle
       sur la carte des chiffres, sous une annonce de deux lignes). */
    .zone > * { flex: 1 1 0; min-width: 0; min-height: 0; }
    /* Zone haute : deux tiers pour l'annonce et les chiffres, un tiers pour le
       flux des prêts — secondaire, et le seul bloc dont on peut rogner la
       largeur sans perdre d'information (les noms de jeux sont déjà tronqués
       en fin de ligne). */
    .zone-haute > .bloc-info { flex: 2 1 0; }
    .zone-haute > .panneau   { flex: 1 1 0; }

    /* Colonne gauche de la zone haute : l'annonce chapeaute les chiffres. */
    .bloc-info {
      display: flex; flex-direction: column; gap: 0.8vw;
      overflow: hidden;   /* filet : jamais de débordement sur la zone du bas */
    }

    /* --- Bandeau d'annonce libre, piloté depuis /admin/ecran-salle --- */
    .bandeau-annonce {
      flex: 0 0 auto;
      display: none;   /* affiché en JS seulement quand une annonce est active */
      background: var(--annonce-fond);
      color: var(--annonce-texte);
      border-radius: 0.8vw;
      padding: 0.8vw 1.4vw;
      font-size: 1.45em;
      font-weight: 700;
      align-items: baseline;
      gap: 0.7em;
    }
    .bandeau-annonce .puce-annonce { font-size: 1.2em; }
    /* 200 caractères tiennent en deux lignes à cette largeur ; au-delà, on
       borne plutôt que de laisser l'annonce manger la carte des chiffres. */
    .bandeau-annonce span[id] {
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* --- Barre de compteurs : les trois chiffres ne doivent pas écraser
       l'information vivante (tournois, animations, mouvements). --- */
    .barre-chiffres {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 1.3vw;
      background: var(--carte);
      border: 1px solid var(--bordure);
      border-radius: 1vw;
      padding: 0.6vw 1.4vw;
    }
    .barre-chiffres .item {
      display: flex;
      align-items: baseline;
      gap: 0.5em;
    }
    .barre-chiffres .nombre {
      font-size: 2.1em; font-weight: 800; line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .barre-chiffres .detail {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
    }
    .barre-chiffres .libelle {
      font-size: 0.78em; color: var(--attenue);
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .barre-chiffres .sous { font-size: 0.72em; color: var(--attenue); }
    .barre-chiffres .separateur {
      align-self: stretch;
      width: 1px;
      background: var(--bordure);
    }
    .nombre.sortis { color: var(--orange); }
    .nombre.dispo  { color: var(--vert); }
    .nombre.poch   { color: var(--accent); }

    /* --- Panneaux --- */
    .panneau {
      background: var(--carte);
      border: 1px solid var(--bordure);
      border-radius: 1vw;
      padding: 1vw 1.3vw;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;   /* filet : rien ne déborde jamais hors de la carte */
    }
    .panneau h2 {
      flex: 0 0 auto;
      font-size: 1.4em; margin-bottom: 0.5vw;
      border-bottom: 2px solid var(--bordure); padding-bottom: 0.4vw;
    }
    /* Zone haute : chaque ligne de titre coûte deux lignes de contenu dans un
       bloc trois fois moins haut que ceux du bas. */
    .zone-haute .panneau h2 { font-size: 1.15em; margin-bottom: 0.35vw; }
    /* `overflow: hidden` + troncature explicite en JS : une liste plus longue
       que son panneau se termine par « et N autres… » plutôt que de disparaître
       en silence. L'écran ne doit jamais mentir sur ce qu'il ne montre pas. */
    .liste { flex: 1 1 auto; overflow: hidden; min-height: 0; }
    .liste.courte { flex: 0 1 auto; }
    .reste {
      color: var(--attenue); font-size: 0.9em; font-style: italic;
      padding-top: 0.3vw;
    }
    .vide { color: var(--attenue); font-size: 1.1em; padding: 0.6vw 0; font-style: italic; }
    .bloc-titre {
      flex: 0 0 auto;
      font-size: 0.95em; color: var(--attenue); margin: 0.6vw 0 0.3vw;
      text-transform: uppercase; letter-spacing: 1px;
    }
    .bloc-titre:first-of-type { margin-top: 0.2vw; }

    /* --- Ligne d'agenda (tournois à venir, animations) ---
       L'HEURE est la clé de lecture : colonne fixe à gauche, chiffres
       tabulaires alignés d'une ligne à l'autre, couleur d'accent. Le regard
       descend la colonne des heures, puis se porte sur le titre. */
    .ligne {
      display: flex; align-items: baseline; gap: 0.8em;
      padding: 0.45vw 0; border-bottom: 1px solid var(--bordure);
    }
    .ligne .heure {
      flex: 0 0 auto;
      font-size: 1.5em; font-weight: 800; color: var(--accent);
      font-variant-numeric: tabular-nums; line-height: 1.1;
    }
    .ligne .corps { flex: 1 1 auto; min-width: 0; }
    .ligne .nom {
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
      font-size: 1.3em; font-weight: 700;
    }
    .ligne .sous { display: block; font-size: 0.95em; color: var(--attenue); }
    .ligne .meta {
      flex: 0 0 auto; font-size: 1em; color: var(--attenue); white-space: nowrap;
    }
    .ligne .places { flex: 0 0 auto; font-size: 1em; white-space: nowrap; }
    .ligne .places.libres  { color: var(--vert); }
    .ligne .places.complet { color: var(--rouge); font-weight: 700; }

    /* Élément le plus proche : mis en avant sobrement, et seul à porter le
       délai « dans N min » — sur les lignes suivantes l'heure suffit, le
       délai n'ajoutait que du bruit. */
    .ligne.bientot {
      background: var(--carte-2);
      border-bottom-color: transparent;
      border-left: 0.3em solid var(--accent);
      padding-left: 0.6em;
    }
    .ligne .dans {
      display: block; font-size: 0.55em; font-weight: 600; color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    /* Animation annulée : barrée et estompée, mais TOUJOURS affichée pendant
       son créneau — des gens l'attendent, la faire disparaître sans rien dire
       serait pire que de l'afficher. */
    .ligne.annule { opacity: 0.55; }
    .ligne.annule .nom { text-decoration: line-through; }
    .ligne.annule .heure { color: var(--attenue); }
    .etiquette-annule {
      font-size: 0.6em; font-weight: 700; color: var(--rouge);
      text-transform: uppercase; letter-spacing: 0.5px; margin-left: 0.5em;
    }

    /* --- Flux des mouvements ---
       Une pastille de couleur porte le sens (orange = sortie, vert = retour) ;
       le mot n'est plus qu'une confirmation en tout petit. Le NOM DU JEU
       redevient l'élément le plus gros de la ligne. */
    .mouv {
      display: grid;
      grid-template-columns: auto 3em 1fr auto;
      align-items: baseline; gap: 0.5em;
      padding: 0.25vw 0; border-bottom: 1px solid var(--bordure);
    }
    .mouv .pastille {
      width: 0.45em; height: 0.45em; border-radius: 50%;
      align-self: center;
    }
    .mouv .genre {
      font-size: 0.62em; text-transform: uppercase; letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .mouv.pret   .pastille { background: var(--orange); }
    .mouv.pret   .genre    { color: var(--orange); }
    .mouv.retour .pastille { background: var(--vert); }
    .mouv.retour .genre    { color: var(--vert); }
    /* Typographie resserrée : le flux ne dispose plus que d'un demi-bloc de la
       zone haute. Il est secondaire (il montre que ça vit), les tournois et
       les animations passent avant. Ce qui ne tient pas est annoncé par
       « et N autres… » plutôt que coupé en silence. */
    .mouv .nom {
      font-size: 0.9em; font-weight: 600;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .mouv .quand {
      font-size: 0.8em; color: var(--attenue);
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .mouv:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="ecran">
    <header class="entete">
      <h1 id="titre">{{ data.titre }}</h1>
      <div class="horloge">
        <span class="point" id="point-battement"></span><span id="horloge">--:--</span><span class="statut-reseau" id="statut-reseau">hors ligne</span>
      </div>
    </header>

    <section class="zone zone-haute" id="zone-haute">
      <div class="bloc-info" id="bloc-info">
        <section class="bandeau-annonce" id="bandeau-annonce">
          <span class="puce-annonce">📣</span><span id="annonce-texte"></span>
        </section>

        <section class="barre-chiffres" id="barre-chiffres">
          <div class="item">
            <span class="nombre sortis" id="c-sortis">–</span>
            <span class="detail">
              <span class="libelle">Jeux sortis</span>
              <span class="sous"><span id="c-total">–</span> au total</span>
            </span>
          </div>
          <span class="separateur"></span>
          <div class="item">
            <span class="nombre dispo" id="c-dispo">–</span>
            <span class="detail">
              <span class="libelle">Jeux disponibles</span>
              <span class="sous">prêts à emprunter</span>
            </span>
          </div>
          <span class="separateur" id="sep-tournois"></span>
          <div class="item" id="item-tournois">
            <span class="nombre poch" id="c-tournois">–</span>
            <span class="detail">
              <span class="libelle">Tournois en cours</span>
              <span class="sous">en ce moment</span>
            </span>
          </div>
        </section>
      </div>

      <div class="panneau" id="panneau-mouvements">
        <h2>🔄 Prêts &amp; retours</h2>
        <div class="liste" id="mouvements"></div>
      </div>
    </section>

    <section class="zone zone-basse" id="zone-basse">
      <div class="panneau" id="panneau-tournois">
        <h2>🏆 Tournois</h2>
        <div class="bloc-titre">En cours</div>
        <div class="liste courte" id="t-en-cours"></div>
        <div class="bloc-titre">Prochains (2 h)</div>
        <div class="liste" id="t-a-venir"></div>
      </div>

      <div class="panneau" id="panneau-programme">
        <h2>🎲 Animations</h2>
        <div class="bloc-titre">Prochaines (2 h)</div>
        <div class="liste" id="p-a-venir"></div>
      </div>
    </section>
  </div>

  <script>
    // Données initiales rendues côté serveur (évite un écran vide au chargement).
    let DONNEES = {{ data | tojson }};
    const INTERVALLE_MS = 10000;   // rafraîchissement des données toutes les 10 s
    // Au-delà de ce nombre d'échecs consécutifs (~30 s), l'écran se déclare
    // "hors ligne" plutôt que de continuer à paraître vivant figé.
    const SEUIL_ECHECS_HORS_LIGNE = 3;
    let echecsConsecutifs = 0;

    function echapper(s) {
      const d = document.createElement("div");
      d.textContent = s == null ? "" : String(s);
      return d.innerHTML;
    }

    function sousTitre(lieu) {
      // « Où ça se passe » : la question qui suit immédiatement l'heure.
      // Jamais de ligne vide quand le champ n'est pas renseigné.
      return lieu ? `<span class="sous">${echapper(lieu)}</span>` : "";
    }

    function delai(minutes) {
      // Affiché sur la seule première ligne (la plus proche), sous l'heure.
      if (minutes == null) return "";
      return minutes === 0
        ? '<span class="dans">maintenant</span>'
        : `<span class="dans">dans ${minutes} min</span>`;
    }

    function libellePlaces(restantes, total) {
      // Sans plafond, on n'invente pas de chiffre ; à zéro, « complet » est
      // une information utile, pas un échec à masquer.
      if (restantes == null) {
        return '<span class="places">inscriptions ouvertes</span>';
      }
      if (restantes === 0) {
        return '<span class="places complet">complet</span>';
      }
      const mot = restantes > 1 ? "places libres" : "place libre";
      const sur = total == null ? "" : ` / ${total}`;
      return `<span class="places libres">${restantes} ${mot}${sur}</span>`;
    }

    function rendreTournoisEnCours(liste) {
      const el = document.getElementById("t-en-cours");
      if (!liste.length) {
        el.innerHTML = '<div class="vide">Aucun tournoi en cours.</div>';
        return;
      }
      // Inscriptions closes : ni heure ni places ici. Le nombre de joueurs dit
      // l'ampleur de ce qui se joue — le mode de scoring, lui, n'aidait
      // personne à décider quoi que ce soit.
      el.innerHTML = liste.map(t => `
        <div class="ligne" data-ligne>
          <span class="corps">
            <span class="nom">${echapper(t.nom)}</span>
            ${sousTitre(t.lieu)}
          </span>
          <span class="meta">${t.nb_inscrits} ${t.nb_inscrits > 1 ? "joueurs" : "joueur"}</span>
        </div>`).join("");
    }

    function rendreTournoisAVenir(liste) {
      const el = document.getElementById("t-a-venir");
      if (!liste.length) {
        el.innerHTML = '<div class="vide">Rien dans les 2 prochaines heures.</div>';
        return;
      }
      // Triée par heure croissante côté serveur : le premier élément est donc
      // le plus proche, seul à être mis en avant et à porter le délai.
      el.innerHTML = liste.map((t, i) => `
        <div class="ligne${i === 0 ? " bientot" : ""}" data-ligne>
          <span class="heure">${echapper(t.heure)}${i === 0 ? delai(t.minutes_avant) : ""}</span>
          <span class="corps">
            <span class="nom">${echapper(t.nom)}</span>
            ${sousTitre(t.lieu)}
          </span>
          ${libellePlaces(t.places_restantes, t.nb_places)}
        </div>`).join("");
    }

    function rendreAnimations(liste) {
      // Animations, ateliers, initiations, temps forts. Même traitement visuel
      // que les tournois à venir : rien ne doit laisser croire à une
      // hiérarchie entre les deux sources.
      const el = document.getElementById("p-a-venir");
      if (!liste.length) {
        el.innerHTML = '<div class="vide">Rien dans les 2 prochaines heures.</div>';
        return;
      }
      el.innerHTML = liste.map((a, i) => {
        const bientot = i === 0 && !a.annule;
        const icone = a.icone ? echapper(a.icone) + " " : "";
        const marque = a.annule
          ? '<span class="etiquette-annule">annulé</span>' : "";
        return `
        <div class="ligne${bientot ? " bientot" : ""}${a.annule ? " annule" : ""}" data-ligne>
          <span class="heure">${echapper(a.heure)}${bientot ? delai(a.minutes_avant) : ""}</span>
          <span class="corps">
            <span class="nom">${icone}${echapper(a.nom)}${marque}</span>
            ${sousTitre(a.lieu)}
          </span>
        </div>`;
      }).join("");
    }

    function rendreMouvements(liste) {
      const el = document.getElementById("mouvements");
      if (!liste.length) {
        el.innerHTML = '<div class="vide">Aucun mouvement pour l\'instant.</div>';
        return;
      }
      el.innerHTML = liste.map(m => {
        const estPret = m.type === "pret";
        const genre = estPret
          ? (m.motif === "tournoi" ? "tournoi" : "prêt")
          : "retour";
        return `
        <div class="mouv ${estPret ? "pret" : "retour"}" data-ligne>
          <span class="pastille"></span>
          <span class="genre">${genre}</span>
          <span class="nom">${echapper(m.nom)}</span>
          <span class="quand">${echapper(m.heure)}</span>
        </div>`;
      }).join("");
    }

    function tronquer(liste) {
      // Masque les lignes qui ne tiennent pas dans la hauteur du panneau et
      // annonce combien il en reste. Rejoué à chaque rendu, donc après toute
      // apparition/disparition de l'annonce ou d'un panneau voisin.
      if (!liste) return;
      const lignes = Array.from(liste.querySelectorAll("[data-ligne]"));
      lignes.forEach(l => { l.style.display = ""; });
      const note = liste.querySelector(".reste");
      if (note) note.remove();
      if (liste.scrollHeight <= liste.clientHeight) return;

      const marque = document.createElement("div");
      marque.className = "reste";
      marque.textContent = "et 1 autre…";
      liste.appendChild(marque);   // la note occupe de la place : elle compte

      let caches = 0;
      for (let i = lignes.length - 1; i >= 0; i--) {
        if (liste.scrollHeight <= liste.clientHeight) break;
        lignes[i].style.display = "none";
        caches += 1;
      }
      if (caches === 0) { marque.remove(); return; }
      marque.textContent = `et ${caches} autre${caches > 1 ? "s" : ""}…`;
    }

    function rendreAnnonce(texte) {
      // Apparition/disparition sans rechargement. textContent uniquement
      // (jamais innerHTML) : le texte vient d'une saisie libre en admin.
      const el = document.getElementById("bandeau-annonce");
      if (texte) {
        document.getElementById("annonce-texte").textContent = texte;
        el.style.display = "flex";
      } else {
        el.style.display = "none";
      }
    }

    function afficher(id, visible, mode) {
      const el = document.getElementById(id);
      if (el) el.style.display = visible ? (mode || "block") : "none";
    }

    function rendre(d) {
      // Panneaux réglés depuis /admin/ecran-salle. Le défaut « tout affiché »
      // couvre aussi une réponse ancienne dépourvue de ce champ.
      const p = d.panneaux || { chiffres: true, tournois: true, programme: true, mouvements: true };
      const tournois = d.tournois_en_cours || [];
      const aVenir = d.tournois_a_venir || [];
      const animations = d.animations || [];

      if (d.titre) {
        document.getElementById("titre").textContent = d.titre;
        document.title = d.titre + " — Tableau de bord";
      }
      rendreAnnonce(d.annonce);

      // --- Barre de chiffres ---
      afficher("barre-chiffres", !!p.chiffres, "flex");
      if (p.chiffres && d.jeux) {
        document.getElementById("c-sortis").textContent = d.jeux.sortis;
        document.getElementById("c-dispo").textContent = d.jeux.disponibles;
        document.getElementById("c-total").textContent = d.jeux.total;
      }
      // Le compteur de tournois disparaît si le module est désactivé : le
      // serveur omet alors le champ (jamais de « 0 » trompeur).
      const compteurTournois = d.nb_tournois_en_cours != null;
      afficher("item-tournois", compteurTournois, "flex");
      afficher("sep-tournois", compteurTournois);
      if (compteurTournois) {
        document.getElementById("c-tournois").textContent = d.nb_tournois_en_cours;
      }

      // L'horloge NE dépend PAS de d.horodatage pour l'affichage (elle tique
      // localement, voir tiquerHorloge) : ce champ ne sert qu'à garder /live
      // et /live/data concordants dans les données brutes.
      if (p.tournois) {
        rendreTournoisEnCours(tournois);
        rendreTournoisAVenir(aVenir);
      }
      if (p.programme) rendreAnimations(animations);
      if (p.mouvements) rendreMouvements(d.mouvements || []);

      // --- Ce qui est visible ---
      // Un panneau garde sa place s'il est ACTIVÉ et a quelque chose à
      // montrer. Le flux des mouvements fait exception : il affiche « aucun
      // mouvement pour l'instant », qui est une information utile en salle.
      // Le panneau tournois, lui, ne mérite pas une demi-zone pour un simple
      // message.
      const montreTournois = !!p.tournois && (tournois.length > 0 || aVenir.length > 0);
      const montreProgramme = !!p.programme && animations.length > 0;
      const montreMouvements = !!p.mouvements;
      const montreInfo = !!p.chiffres || !!d.annonce;

      afficher("bloc-info", montreInfo, "flex");
      afficher("panneau-mouvements", montreMouvements, "flex");
      afficher("panneau-tournois", montreTournois, "flex");
      afficher("panneau-programme", montreProgramme, "flex");
      // Une zone entièrement éteinte disparaît et rend sa hauteur à l'autre ;
      // à l'intérieur d'une zone, le bloc restant s'étend de lui-même (flex).
      // Tout éteindre est un usage assumé (écran d'annonces seules).
      afficher("zone-haute", montreInfo || montreMouvements, "flex");
      afficher("zone-basse", montreTournois || montreProgramme, "flex");

      // Troncature APRÈS mise en place : les hauteurs ne sont connues qu'une
      // fois les panneaux visibles et dimensionnés.
      ["mouvements", "t-en-cours", "t-a-venir", "p-a-venir"]
        .forEach(id => tronquer(document.getElementById(id)));
    }

    function tiquerHorloge() {
      // Horloge purement locale : continue de tourner même si le réseau tombe,
      // pour ne jamais donner l'illusion d'un écran figé.
      const d = new Date();
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      document.getElementById("horloge").textContent = `${hh}:${mm}`;
    }

    function rendreStatutReseau(horsLigne) {
      document.getElementById("point-battement").classList.toggle("hors-ligne", horsLigne);
      document.getElementById("statut-reseau").style.display = horsLigne ? "inline" : "none";
    }

    async function rafraichir() {
      try {
        const r = await fetch("/live/data", { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        DONNEES = await r.json();
        rendre(DONNEES);
        echecsConsecutifs = 0;
        rendreStatutReseau(false);
      } catch (e) {
        // Réseau momentanément indisponible : on garde l'affichage précédent,
        // mais on compte les échecs pour signaler un décrochage prolongé.
        echecsConsecutifs += 1;
        if (echecsConsecutifs >= SEUIL_ECHECS_HORS_LIGNE) {
          rendreStatutReseau(true);
        }
      }
    }

    rendre(DONNEES);                       // affichage immédiat (données serveur)
    tiquerHorloge();
    setInterval(tiquerHorloge, 1000);       // horloge locale, indépendante du réseau
    setInterval(rafraichir, INTERVALLE_MS); // puis mise à jour des données en boucle
    // Un redimensionnement (rotation d'écran, changement de résolution TV)
    // change ce qui tient à l'écran : on recalcule la troncature.
    window.addEventListener("resize", () => rendre(DONNEES));
  </script>
</body>
</html>
