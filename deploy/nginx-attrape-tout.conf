# Attrape-tout nginx : ferme toute visite qui ne vise ni le site de prêt ni
# celui de formation (PROD-07, lot-10-pré-production).
#
# Installation (deploy/install.sh le fait ; à la main, voir
# docs/deploiement.md, « Mettre à jour la configuration nginx ») :
#   sudo cp deploy/nginx-attrape-tout.conf /etc/nginx/sites-available/attrape-tout
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo ln -s /etc/nginx/sites-available/attrape-tout /etc/nginx/sites-enabled/attrape-tout
#   sudo nginx -t && sudo systemctl reload nginx
# Aucune valeur à substituer : ni domaine, ni chemin. Le nom installé,
# `attrape-tout`, est celui que le contrôle de report attend
# (`deploy/nginx-<nom>.conf` → `/etc/nginx/sites-available/<nom>`).
#
# POURQUOI
# Sans lui, le site `default` de Debian répondait sur l'adresse IP nue et sous
# n'importe quel nom d'hôte (« Welcome to nginx! » en HTTP), et en HTTPS c'est
# le premier bloc 443 rencontré — celui de la production — qui servait de
# défaut : l'application répondait à tout robot qui balaie les adresses IP, avec
# un certificat au mauvais nom. 41 % du journal d'accès venait de là. Ce bloc
# se déclare `default_server` sur 80 et 443 : il reçoit tout ce qui ne désigne
# pas exactement l'un des deux sites, et ne répond rien.
#
# `sites-enabled/default` DOIT être désactivé en même temps : il se déclare
# lui aussi `default_server` sur le port 80, et deux défauts sur le même port
# font échouer `nginx -t` (« a duplicate default server »).
#
# SANS CERTIFICAT, et c'est voulu. Un `listen 443 ssl` exige d'ordinaire un
# `ssl_certificate`. L'idée d'un certificat auto-signé (`snippets/snakeoil.conf`)
# a été écartée : sur le serveur de référence le fichier de configuration
# existe, mais pas le paquet `ssl-cert` ni le certificat qu'il désigne — et
# `nginx -t` aurait échoué, un rechargement forcé faisant tomber les deux
# sites. `ssl_reject_handshake on` (nginx 1.19.4 et suivants) refuse la
# poignée de main TLS sans présenter aucun certificat : c'est l'exemple même
# de la documentation de ngx_http_ssl_module. Un navigateur qui demande l'un
# des deux domaines (SNI) est dirigé vers son bloc avant d'arriver ici.
#
# PAS d'`ipv6only=on` sur `[::]:443` : certbot l'a déjà posé sur le bloc 443 de
# la production, et ce paramètre ne peut figurer qu'UNE fois par adresse:port,
# tous fichiers confondus — le répéter ici ferait échouer `nginx -t`
# (« duplicate listen options »). C'est de toute façon la valeur par défaut.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;

    # Rien à garder : des balayages de robots, qui noyaient le journal d'accès
    # dans un format sans temps de réponse (PROD-07).
    access_log off;

    # 444 : nginx ferme la connexion sans rien envoyer.
    return 444;
}
