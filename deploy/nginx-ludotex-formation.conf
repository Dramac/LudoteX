# Reverse proxy nginx pour l'INSTANCE DE FORMATION (voir docs/mode-formation.md).
#
# Même principe que nginx-ludotex.conf, sur un SOUS-DOMAINE dédié (jamais un
# préfixe de chemin : les liens absolus des gabarits casseraient) et pointant
# vers le port de l'instance de formation (127.0.0.1:8100, voir
# deploy/ludotex-formation.service).
#
# Installation : voir l'étape optionnelle « site de formation » de
# deploy/install.sh, ou la section correspondante de docs/deploiement.md.

# SEC-04(a) (audit du 24/07/2026) : mêmes zones de limitation de débit que
# nginx-ludotex.conf, mêmes dimensionnements (voir son commentaire détaillé)
# — noms préfixés `ludotexformation_` pour la même raison de collision que
# les `map`/`log_format` juste après.
limit_req_zone $binary_remote_addr zone=ludotexformation_live:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=ludotexformation_stats:10m rate=6r/m;

# SEC-02(a) (audit du 24/07/2026) : même logique de masquage des secrets en
# query string que nginx-ludotex.conf (voir son commentaire détaillé), mais
# avec des noms de `map`/`log_format` DISTINCTS (préfixe `ludotexformation_`
# au lieu de `ludotex_`) : dès que le site de formation est installé, les
# deux fichiers sont fusionnés dans le même contexte http nginx, et deux
# directives de même nom feraient échouer `nginx -t` — donc tomber TOUTE la
# configuration nginx, prod comprise.
# Le site de formation n'a pas de PRET_TOKEN (accès ouvert, décision
# assumée — voir deploy/install.sh étape 9), donc /acces?jeton= n'y est pas
# utilisé en pratique ; mais le module planning (/planning/collecte/{ev}
# ?code=, /planning/mon?code=) tourne avec le même code que la production,
# et rien n'empêche de fixer un PRET_TOKEN sur cette instance plus tard.
# Masqué par cohérence et anticipation, au même coût que sur la production.
map $uri $ludotexformation_route_secrete {
    default                 0;
    /acces                  1;
    /planning/mon           1;
    /planning/mon.ics       1;
    ~^/planning/collecte/   1;
}
map $ludotexformation_route_secrete $ludotexformation_pas_secrete {
    0 1;
    1 0;
}

# ============================================================================
# Lot agora-2, point 4 — temps de réponse dans les DEUX log_format
# ============================================================================
# `rt=$request_time` (durée totale côté nginx) et `uct=$upstream_response_time`
# (durée côté uvicorn seul — vide/"-" pour /static/, qui n'a pas d'amont) : la
# mise en situation de septembre n'a laissé aucun moyen de distinguer a
# posteriori la lenteur serveur de la lenteur réseau ou téléphone. Voir
# interne/comptes-rendus/lot-agora-2-statiques-et-logs.md.
#
# Ajoutées aux DEUX formats, y compris `*_combined_sans_secret` : ce sont deux
# durées, jamais un chemin ni une query string — SEC-02(a) reste intact, le
# jeton et les codes personnels ne transitent toujours que par `$request`,
# absent de ce second format.
log_format ludotexformation_combined
    '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'rt=$request_time uct=$upstream_response_time';

log_format ludotexformation_combined_sans_secret
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'rt=$request_time uct=$upstream_response_time';

server {
    listen 80;
    listen [::]:80;
    server_name formation.pret.example.fr;    # <-- À REMPLACER

    # ------------------------------------------------------------------
    # Lot agora-2, point 3 — compression (CSS, JS, SVG)
    # ------------------------------------------------------------------
    # Identique à nginx-ludotex.conf (voir son commentaire détaillé) : les
    # deux fichiers restent jumeaux sur ce point comme sur les autres.
    #
    # `text/css` et `application/javascript` couvrent `style.css` (42 Ko) et
    # les deux scripts du scanner (`jsQR.js`, 251 Ko, en tête) ; `image/svg+xml`
    # par cohérence, si des SVG rejoignent un jour `app/static/`.
    # `text/html` N'EST PAS dans cette liste : `gzip on` le compresse déjà par
    # défaut, l'y ajouter est l'erreur classique documentée par nginx lui-même.
    # `gzip_vary on` : un cache intermédiaire (proxy, CDN) doit varier sur
    # `Accept-Encoding`, sans quoi il pourrait servir une réponse compressée à
    # un client qui ne l'accepte pas. `gzip_min_length` évite de compresser
    # (coût CPU, pas de gain net) les réponses minuscules — sans effet ici vu
    # la taille des deux fichiers concernés, gardé pour les prochains.
    #
    # SANS INCIDENCE sur les pages applicatives : `gzip_proxied` (qui autorise
    # la compression des réponses reçues par `proxy_pass`) vaut `off` par
    # défaut et n'est pas activé ici — seules les réponses servies DIRECTEMENT
    # par nginx (donc `location /static/` ci-dessous) sont concernées. Aucun
    # comportement applicatif ne change (garde-fou de ce lot).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    # ROB-03(b) (audit du 24/07/2026) : même raisonnement que
    # nginx-ludotex.conf (données de démonstration, mais même code de
    # restauration d'un zip des 3 bases) — voir son commentaire détaillé
    # pour la commande de mesure et la cohérence à garder avec le lot C.
    client_max_body_size 20m;

    # SEC-01 (audit du 24/07/2026) : mêmes en-têtes que la production, mêmes
    # justifications — voir le commentaire détaillé dans nginx-ludotex.conf.
    # Posés au niveau `server` pour que TOUTES les `location` en héritent
    # (add_header n'est pas cumulatif : une location qui déclare son propre
    # add_header perdrait celles-ci) ; `/static/` ci-dessous n'en déclare
    # pas, elle en hérite donc normalement. `certbot --nginx --redirect`
    # duplique ce bloc vers le 443 : ces en-têtes s'y retrouvent après
    # `sudo certbot --nginx -d <sous-domaine de formation>`.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    access_log /var/log/nginx/access.log ludotexformation_combined if=$ludotexformation_pas_secrete;
    access_log /var/log/nginx/access.log ludotexformation_combined_sans_secret if=$ludotexformation_route_secrete;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Mêmes fichiers statiques que la production (même code).
    location /static/ {
        alias /opt/ludotex/app/static/;       # <-- adapter le chemin si besoin
        access_log off;
        # Lot agora-2, point 2 — cache long, permis par le point 1
        # (app/templating.py::asset_v) : l'URL change désormais avec le
        # fichier (`?v=`), donc un cache d'un an ne sert plus jamais une
        # version périmée à un navigateur.
        #
        # ÉCART ASSUMÉ avec le prompt du lot, qui proposait d'ajouter aussi
        # `Cache-Control: public, immutable` : `add_header` N'EST PAS
        # cumulatif (voir le commentaire SEC-01 de nginx-ludotex.conf, qui
        # cite PRÉCISÉMENT cette `location` comme exemple de ce qui n'en
        # hérite PAS moins) — poser ici un `add_header Cache-Control` ferait
        # perdre à cette seule `location` les cinq en-têtes de sécurité
        # SEC-01 (Strict-Transport-Security, X-Frame-Options,
        # X-Content-Type-Options, Referrer-Policy, CSP), garde-fou explicite
        # de ce lot. Les redéclarer ici les dupliquerait dans les DEUX
        # fichiers, exactement ce que le projet évite par ailleurs (un seul
        # domicile par règle). `expires 1y` seul pose déjà
        # `Cache-Control: max-age=31536000` et `Expires`, ce qui couvre
        # l'objectif (cache long) sans ce risque ; `immutable` resterait à
        # ajouter plus tard via un middleware applicatif si Simon le juge
        # utile, plutôt qu'ici. Identique à nginx-ludotex.conf.
        expires 1y;
    }

    location = /live/data {
        limit_req zone=ludotexformation_live burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100;
    }

    location ~ ^/stats/export\.(xlsx|pdf)$ {
        limit_req zone=ludotexformation_stats burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
    }
}
