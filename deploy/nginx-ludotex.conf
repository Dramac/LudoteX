# Reverse proxy nginx pour l'application de prêt de jeux.
#
# Installation :
#   sudo cp deploy/nginx-ludotex.conf /etc/nginx/sites-available/ludotex
#   # remplacer pret.example.fr par le vrai sous-domaine, et le chemin /opt/ludotex si besoin
#   sudo ln -s /etc/nginx/sites-available/ludotex /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   # puis obtenir le certificat (ajoute automatiquement le bloc HTTPS + la redirection) :
#   sudo certbot --nginx -d pret.example.fr
#
# CE QUE CERTBOT FAIT DE CE FICHIER — constaté sur le serveur (nginx 1.24.0,
# certbot 2.9.0), pas déduit : il CONVERTIT ce bloc, il ne le duplique pas.
#   - le bloc ci-dessous PERD ses deux `listen 80` et reçoit à la place les
#     lignes `listen 443 ssl` + `ssl_certificate*` en fin de bloc ; tout le
#     reste (les `location`, les `add_header`, les `access_log`) reste ici et
#     ne bouge pas ;
#   - un SECOND bloc, minuscule, est créé pour le port 80 : un
#     `if ($host = <domaine>) { return 301 https://... }` puis `return 404`.
#     Ce bloc ne porte AUCUN `add_header` et n'a pas à en porter — il ne sert
#     que des redirections.
# Conséquence pratique : il n'y a qu'UN SEUL vrai bloc, celui-ci. Une
# directive ajoutée ici n'est jamais à recopier ailleurs. Les versions
# antérieures de ce commentaire affirmaient une duplication ; c'est cette
# erreur qui avait produit la consigne fausse « reporter dans les deux
# blocs » du §12 du wiki.

# ============================================================================
# SEC-04(a) — zones de limitation de débit
# ============================================================================
# `limit_req_zone` doit être déclaré HORS d'un bloc `server`, donc au niveau
# `http` (même remarque que pour `map`/`log_format` juste après). Noms
# préfixés `ludotex_` pour ne jamais entrer en collision avec ceux,
# préfixés `ludotexformation_`, de nginx-ludotex-formation.conf.
#
# Dimensionnement :
#   - /live/data : interrogé par CHAQUE écran de salle toutes les 10 s
#     (~0,1 req/s par écran, voir app/static JS de live.html). rate=2r/s
#     laisse une marge x20 même avec plusieurs écrans derrière la même IP
#     (NAT d'un même local associatif) ; burst=20 absorbe un rechargement
#     manuel groupé (plusieurs onglets rafraîchis à la suite) ; nodelay pour
#     ne JAMAIS mettre en attente le polling normal — seul un abus franc
#     (script, `ab -c 20`) déclenche un 429.
#   - /stats/export.xlsx|pdf : génération CPU (reportlab/openpyxl), usage
#     bureau ponctuel (quelques exports par jour au grand maximum).
#     rate=6r/m (1 toutes les 10 s) + burst=3 nodelay couvre un double-clic
#     ou un essai xlsx-puis-pdf coup sur coup, mais bloque un flood
#     automatisé qui saturerait l'unique worker uvicorn (SEC-04).
limit_req_zone $binary_remote_addr zone=ludotex_live:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=ludotex_stats:10m rate=6r/m;

# ============================================================================
# SEC-02(a) — ne pas journaliser le jeton/les codes en clair dans access.log
# ============================================================================
# Le jeton bénévole (?jeton=) et les codes personnels planning (?code=, qui
# ouvrent nom + contact + disponibilités + affectations d'un bénévole — voir
# SEC-02 de l'audit) transitent en query string sur ces quatre routes. Le
# journal APPLICATIF (app/journal.py) les exclut déjà soigneusement
# (docs/conception-journal.md §8) ; access.log nginx était donc le SEUL
# endroit où ils fuyaient encore en clair.
#
# `map`/`log_format` doivent être déclarés HORS d'un bloc `server`, donc au
# niveau `http` — ce fichier y est textuellement inclus via
# /etc/nginx/sites-enabled/ (voir /etc/nginx/nginx.conf). Noms préfixés
# `ludotex_` pour ne jamais entrer en collision avec ceux, préfixés
# `ludotexformation_`, de nginx-ludotex-formation.conf : dès que le site de
# formation est installé, les DEUX fichiers sont fusionnés dans le même
# contexte http, et nginx refuse deux `map`/`log_format` de même nom
# (`nginx -t` échoue et le site entier ne recharge plus, prod comprise).
#
# Choix retenu : un `map` sélectionne ces routes par $uri (le CHEMIN seul,
# sans "?..."), puis DEUX `access_log` conditionnels (dans le bloc `server`
# plus bas) écrivent soit le format normal (avec $request, donc les
# arguments), soit un format qui journalise $uri à la place de $request —
# jamais les deux pour la même requête, comme dans l'exemple officiel de
# journalisation conditionnelle de nginx. Alternative écartée : couper
# access_log entièrement sur ces routes (comme /static/ plus bas) — on
# perdrait toute trace d'activité, pourtant utile pour repérer un abus de
# /acces (lié à SEC-03/SEC-04), alors que retirer seulement les arguments
# suffit à l'objectif.
#
# Hors périmètre de ce lot, à noter pour Simon : /tournoi/desinscription
# reçoit aussi un ?code=, sous la même forme. Laissé de côté ici car ce code
# est moins sensible (retire un participant d'une liste publique, ne donne
# accès à aucune coordonnée — voir app/tournoi/routes.py) ; à couvrir plus
# tard si le besoin se confirme.
map $uri $ludotex_route_secrete {
    default                 0;
    /acces                  1;
    /planning/mon           1;
    /planning/mon.ics       1;
    ~^/planning/collecte/   1;
}
map $ludotex_route_secrete $ludotex_pas_secrete {
    0 1;
    1 0;
}

# ============================================================================
# Lot agora-2, point 4 — temps de réponse dans les DEUX log_format
# ============================================================================
# `rt=$request_time` (durée totale côté nginx) et `uct=$upstream_response_time`
# (durée côté uvicorn seul — vide/"-" pour /static/, qui n'a pas d'amont) : la
# mise en situation de septembre n'a laissé aucun moyen de distinguer a
# posteriori la lenteur serveur de la lenteur réseau ou téléphone. Voir
# interne/comptes-rendus/lot-agora-2-statiques-et-logs.md.
#
# Ajoutées aux DEUX formats, y compris `*_combined_sans_secret` : ce sont deux
# durées, jamais un chemin ni une query string — SEC-02(a) reste intact, le
# jeton et les codes personnels ne transitent toujours que par `$request`,
# absent de ce second format.
log_format ludotex_combined
    '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'rt=$request_time uct=$upstream_response_time';

log_format ludotex_combined_sans_secret
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'rt=$request_time uct=$upstream_response_time';

server {
    listen 80;
    listen [::]:80;
    server_name pret.example.fr;          # <-- À REMPLACER

    # ------------------------------------------------------------------
    # Lot agora-2, point 3 — compression (CSS, JS, SVG)
    # ------------------------------------------------------------------
    # Dans le bloc `server` (pas `http`) : même raison que `map`/`log_format`
    # en tête de fichier — le site de formation fusionne les deux fichiers
    # dans un seul contexte `http` une fois installé, et une directive en
    # collision y ferait échouer `nginx -t` pour les deux sites, prod
    # comprise. `gzip`/`gzip_types` n'ont pas ce risque de collision (ce ne
    # sont pas des définitions nommées comme `map`/`log_format`), mais rester
    # au même niveau que ces dernières les garde toutes visibles ensemble.
    #
    # `text/css` et `application/javascript` couvrent `style.css` (42 Ko) et
    # les deux scripts du scanner (`jsQR.js`, 251 Ko, en tête) ; `image/svg+xml`
    # par cohérence, si des SVG rejoignent un jour `app/static/`.
    # `text/html` N'EST PAS dans cette liste : `gzip on` le compresse déjà par
    # défaut, l'y ajouter est l'erreur classique documentée par nginx lui-même.
    # `gzip_vary on` : un cache intermédiaire (proxy, CDN) doit varier sur
    # `Accept-Encoding`, sans quoi il pourrait servir une réponse compressée à
    # un client qui ne l'accepte pas. `gzip_min_length` évite de compresser
    # (coût CPU, pas de gain net) les réponses minuscules — sans effet ici vu
    # la taille des deux fichiers concernés, gardé pour les prochains.
    #
    # ============================================================
    # Hors-série (correction du lot agora-2) — `gzip_proxied`
    # ============================================================
    # CORRECTIF : le commentaire committé par le lot agora-2 affirmait que
    # ces directives étaient « SANS INCIDENCE sur les pages applicatives »
    # parce que `gzip_proxied` (qui vaut `off` par défaut) ne serait pas
    # activé ici. C'est un contresens sur cette directive — corrigé ici,
    # AVANT le déploiement du lot agora-2 (voir interne/chantiers.md).
    #
    # Documentation nginx (ngx_http_gzip_module) : « The fact that the
    # request is proxied is determined by the presence of the "Via" request
    # header field. » `gzip_proxied` porte donc sur la REQUÊTE ENTRANTE du
    # client (porte-t-elle un en-tête `Via` ?), PAS sur le fait que nginx
    # aille chercher la réponse en amont par `proxy_pass`.
    #
    # Conséquence réelle : les pages applicatives (`/`, `/catalogue`,
    # `/pret/...`, etc.) SONT compressées — `gzip on` couvre `text/html` par
    # défaut, et un navigateur ordinaire n'envoie pas de `Via`. C'est un
    # gain (le plus direct sur le ressenti « site un peu long à charger »
    # du retour terrain), pas un problème — mais ce n'est PAS ce qu'affirmait
    # le commentaire d'origine, et le garde-fou « aucun comportement
    # applicatif ne change » du lot agora-2 n'était pas fondé.
    #
    # `gzip_proxied any` ci-dessous : sans lui, le seul effet réel de
    # `gzip_proxied off` s'applique — un visiteur passant par un proxy qui
    # ajoute `Via` (proxy d'entreprise, réseau invité) recevrait ces mêmes
    # pages EN CLAIR. Retenu ici : il n'y a ni CDN ni cache intermédiaire
    # maîtrisé devant ce serveur, et `gzip_vary on` (ci-dessus) fait déjà
    # varier correctement sur `Accept-Encoding` un cache qui verrait passer
    # la réponse.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript image/svg+xml;

    # ------------------------------------------------------------------
    # ROB-03(b) — taille max d'un envoi
    # ------------------------------------------------------------------
    # Les imports CSV se font en ligne de commande (pas concerné), mais la
    # restauration d'une sauvegarde (/admin/données → « Restaurer une
    # sauvegarde ») téléverse un ZIP des TROIS bases (prêt + tournois +
    # planning) par ce même chemin HTTP.
    #
    # Mesurer la taille RÉELLE d'une archive sur cette installation :
    #   sudo -u pretjeux /opt/ludotex/deploy/sauvegarde.sh /opt/ludotex /var/lib/ludotex/sauvegardes
    #   ls -lh /var/lib/ludotex/sauvegardes/ludotex-backup-*.zip | tail -1
    # (adapter les chemins si l'installation ne suit pas les valeurs par
    # défaut de deploy/install.sh).
    #
    # Sur le catalogue de référence (~700 exemplaires + historique), une
    # telle archive se compte en Mo — largement sous les 5m d'origine, mais
    # 5m ne laissait AUCUNE marge pour la croissance de l'historique des
    # prêts au fil des saisons (une restauration aurait fini en 413 sans
    # message clair). 20m ci-dessous donne une marge x4 à x10 sur la mesure
    # attendue à ce jour.
    # ⚠️ Cohérence à garder avec le lot C (ROB-03(a), pas encore fait à ce
    # jour) : ce lot doit fixer un plafond APPLICATIF sur le même import
    # (routes/admin.py, aujourd'hui sans limite explicite) — choisir alors
    # une valeur >= ces 20m, sans quoi l'application rejetterait des envois
    # que nginx aurait pourtant laissés passer. Si une mesure réelle
    # dépasse durablement 15m, remonter les DEUX valeurs ensemble.
    client_max_body_size 20m;

    # ------------------------------------------------------------------
    # SEC-01 — en-têtes de sécurité HTTP
    # ------------------------------------------------------------------
    # Posés au niveau `server` (pas dans une seule `location`) : add_header
    # N'EST PAS cumulatif — une `location` qui déclare son propre add_header
    # perd TOUS ceux hérités du niveau parent (piège classique nginx).
    # Vérifié : la `location /static/` ci-dessous utilise `expires`, une
    # directive DIFFÉRENTE qui ne réinitialise pas l'héritage d'add_header —
    # elle en hérite donc bien, ce qui est voulu : X-Content-Type-Options
    # protège aussi le CSS/JS servi statiquement (notamment le scanner QR).
    #
    # `certbot --nginx --redirect` CONVERTIT ce bloc en bloc HTTPS (voir le
    # commentaire en tête de fichier) : ces cinq en-têtes restent donc
    # exactement ici, et se retrouvent servis en 443 après
    # `sudo certbot --nginx -d <domaine>` (voir deploy/install.sh, étape 7).
    # Le second bloc que certbot crée pour le port 80 ne les porte PAS, et
    # n'a pas à les porter : il ne répond que par une redirection 301, et
    # Strict-Transport-Security reçu en clair est de toute façon ignoré par
    # le navigateur (RFC 6797 §6.1). Ne pas les y recopier « pour faire
    # bonne mesure » — ce serait la même erreur que la consigne « reporter
    # dans les deux blocs » corrigée au §12 du wiki.
    #
    # Vérification après passage de certbot :
    #   curl -sI https://<domaine>/ | grep -iE 'strict-transport|frame-options|content-type-options|referrer-policy|content-security-policy'
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # CSP : la plus stricte compatible avec l'état ACTUEL des gabarits.
    # 10 gabarits ont des <script> inline SANS nonce (base.html, live.html,
    # admin_jeton.html, admin_etiquettes.html, admin_live.html,
    # admin_fonctionnalites.html, admin_rangement_ranger.html,
    # tournoi_gerer.html, tournoi_inscription_ok.html,
    # planning_collecte_ok.html) → script-src exige 'unsafe-inline'.
    # live.html a un <style> inline → style-src exige 'unsafe-inline'.
    # app/static/css/style.css charge une image de fond en URI `data:`
    # (filigrane du mode formation) → img-src autorise data:.
    # Aucune ressource externe n'est chargée nulle part (jsQR est servi en
    # local, app/static/js/jsQR.js) : script-src/style-src/font-src/
    # connect-src restent tous 'self'.
    #
    # CE QUE CETTE CSP NE PROTÈGE PAS : avec 'unsafe-inline', elle
    # n'empêche PAS l'exécution d'un script injecté (XSS) — seule
    # l'échappement Jinja (autoescape actif partout, déjà vérifié solide
    # par l'audit) protège de ça aujourd'hui. Ce que la CSP apporte
    # réellement : aucun script/style/image ne peut être chargé depuis un
    # domaine tiers (limite l'exfiltration et les payloads XSS "à
    # distance"), aucun <object>/<embed>, aucune mise en <iframe> du site
    # (frame-ancestors 'none', redondant avec X-Frame-Options mais lu par
    # davantage de navigateurs), et form-action 'self' empêche un
    # formulaire piégé de soumettre ailleurs. Durcissement possible plus
    # tard : passer les 10 gabarits à des nonces générés par requête
    # (demande un middleware FastAPI — hors périmètre « nginx seul » de ce
    # lot) pour retirer 'unsafe-inline'.
    #
    # Pages à rouvrir après activation, au minimum (console F12, onglet
    # Console : chercher une ligne "Refused to..." liée à la CSP) :
    #   /live, /scanner, /admin/jeton, /admin/etiquettes,
    #   /tournoi/<id>/gerer
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # SEC-02(a) : voir le `map`/log_format déclarés en tête de fichier.
    access_log /var/log/nginx/access.log ludotex_combined if=$ludotex_pas_secrete;
    access_log /var/log/nginx/access.log ludotex_combined_sans_secret if=$ludotex_route_secrete;

    # En-têtes transmis à uvicorn, communs à toutes les `location`
    # ci-dessous — remontés ici (au lieu d'être répétés dans `location /`
    # comme avant SEC-04(a)) pour que les deux nouvelles `location` de
    # limitation de débit en héritent aussi. Même règle d'héritage que
    # add_header (proxy_set_header n'est pas cumulatif non plus) : aucune
    # `location` ne les redéclare, donc toutes en héritent.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;   # => HTTPS vu par l'app (cookies Secure)

    # Fichiers statiques servis directement par nginx (CSS, JS du scanner, logo).
    location /static/ {
        alias /opt/ludotex/app/static/;   # <-- adapter le chemin si besoin
        access_log off;
        # Lot agora-2, point 2 — cache long, permis par le point 1
        # (app/templating.py::asset_v) : l'URL change désormais avec le
        # fichier (`?v=`), donc un cache d'un an ne sert plus jamais une
        # version périmée à un navigateur.
        #
        # ÉCART ASSUMÉ avec le prompt du lot, qui proposait d'ajouter aussi
        # `Cache-Control: public, immutable` : `add_header` N'EST PAS
        # cumulatif (voir le commentaire SEC-01 plus haut, qui cite
        # PRÉCISÉMENT cette `location` comme exemple de ce qui n'en hérite
        # PAS moins) — poser ici un `add_header Cache-Control` ferait perdre
        # à cette seule `location` les cinq en-têtes de sécurité SEC-01
        # (Strict-Transport-Security, X-Frame-Options, X-Content-Type-Options,
        # Referrer-Policy, CSP), garde-fou explicite de ce lot. Les
        # redéclarer ici les dupliquerait dans les DEUX fichiers, exactement
        # ce que le projet évite par ailleurs (un seul domicile par règle).
        # `expires 1y` seul pose déjà `Cache-Control: max-age=31536000` et
        # `Expires`, ce qui couvre l'objectif (cache long) sans ce risque ;
        # `immutable` resterait à ajouter plus tard via un middleware
        # applicatif si Simon le juge utile, plutôt qu'ici.
        expires 1y;
    }

    # SEC-04(a) : voir le dimensionnement en tête de fichier.
    location = /live/data {
        limit_req zone=ludotex_live burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }

    location ~ ^/stats/export\.(xlsx|pdf)$ {
        limit_req zone=ludotex_stats burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }

    # Tout le reste est transmis à uvicorn (écoute locale 127.0.0.1:8000).
    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
