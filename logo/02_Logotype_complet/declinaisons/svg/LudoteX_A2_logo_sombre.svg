<!-- Bloc ludothèque repris selon la référence fournie :
     3 boîtes hautes + une étagère unique + 3 éléments bas -->
<g id="ludotheque" fill="#FFFFFF">

  <!-- niveau supérieur -->
  <rect x="360" y="300" width="170" height="260" rx="3"/>
  <rect x="570" y="390" width="150" height="170" rx="3"/>
  <rect x="760" y="470" width="95" height="90" rx="3"/>

  <!-- unique étagère -->
  <rect x="300" y="590" width="600" height="25" rx="2"/>

  <!-- niveau inférieur -->
  <rect x="360" y="650" width="170" height="240" rx="3"/>
  <rect x="570" y="650" width="280" height="130" rx="3"/>
  <rect x="570" y="810" width="280" height="80" rx="3"/>

</g>

